<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de desarrollo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef2ef;--sf:#fff;--ink:#15231e;--mut:#61706a;--ln:#d9e2dc;--ac:#0f7a63;--ok:#177a44;--wa:#a15c00;--er:#b42318;--code:#f1f5f2;--dk:#0f1c18}
@media (prefers-color-scheme:dark){:root{--bg:#0d1512;--sf:#15211c;--ink:#e6efe9;--mut:#93a89d;--ln:#27382f;--ac:#3fbf9f;--ok:#5fd08a;--wa:#e0b04a;--er:#ff8a7a;--code:#0f1a16;--dk:#08110e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
code,textarea,input,select,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px clamp(16px,4vw,40px);background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.brand{display:flex;gap:12px;align-items:center}.brand small{display:block;color:var(--mut);font-size:13px;line-height:1.2}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--ac);color:#fff;font-weight:800}
#flag{font-size:14px;color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 56px}
.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;align-items:start}
.work{display:grid;gap:20px;min-width:0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(20,40,30,.06)}
.brief{position:sticky;top:84px;max-height:calc(100vh - 104px);overflow:auto}
h2{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
h3{margin:22px 0 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600;font-size:13px;margin-bottom:8px}
.hint{color:var(--mut);font-size:14px}
.ep{border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin:8px 0;background:var(--code)}
.ep p{margin:6px 0}.ep dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.ep dt{color:var(--mut)}.ep dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;word-break:break-word}
.path{font-weight:600;color:var(--ac);font-size:14px}
ul.rl{margin:0;padding-left:18px}ul.rl li{margin:5px 0;font-size:14.5px}
button,select{font:600 14px "Bricolage Grotesque",sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.55;cursor:default}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:1px}
input,textarea{width:100%;border:1px solid var(--ln);background:var(--code);color:var(--ink);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:120px}
label.t{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar input{flex:1 1 220px;min-width:0}.bar select{width:108px;font-family:"IBM Plex Mono",monospace;font-weight:600}
select[data-m=GET],.mb-GET{color:#177a44}select[data-m=POST],.mb-POST{color:#2563eb}select[data-m=PUT],.mb-PUT{color:#a15c00}select[data-m=PATCH],.mb-PATCH{color:#7c3aed}select[data-m=DELETE],.mb-DELETE{color:#b42318}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
pre.out{margin:0;padding:12px;background:var(--dk);color:#d7efe6;border-radius:8px;min-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font:600 12px "IBM Plex Mono",monospace;background:color-mix(in srgb,currentColor 14%,transparent)}
.s2{color:var(--ok)}.s3,.s4{color:var(--wa)}.s5{color:var(--er)}
.hist{display:grid;gap:4px;margin-top:14px}
.hist button{display:flex;gap:8px;align-items:center;text-align:left;font:500 12.5px "IBM Plex Mono",monospace;padding:6px 10px;border-radius:6px}
.hist .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{font-weight:600;min-width:52px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero{max-width:540px;margin:5vh auto}
.steps{display:grid;gap:10px;margin:16px 0 4px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.steps li:before{content:counter(s);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:13px}
.fd{width:100%;border-collapse:collapse;font-size:14px}.fd td{padding:8px 6px;border-top:1px solid var(--ln);vertical-align:top}.fd td:first-child{width:34%;white-space:nowrap}.fd code{color:var(--mut);word-break:break-word;white-space:normal}.fd .path{color:var(--ac)}
@media (max-width:940px){.grid{grid-template-columns:1fr}.brief{position:static;max-height:none}.two{grid-template-columns:1fr}}
</style>
</head>

<header class="top"><div class="brand"><span class="logo">QA</span><div><b>Prueba de desarrollo</b><small>Laboratorio de pruebas de API</small></div></div><span id="flag" role="status"></span></header>
<main><section id="pane"></section></main>
<script>
const S=[
{id:'cupon',nivel:0,emp:'TiendaNova',tit:'Cupones de descuento',
 his:'TiendaNova quiere aplicar cupones en el carrito para calcular cuánto se descuenta y cuál es el total final.',
 doc:['POST /api/cupon  {"code": string, "total": number}','NOVA10: 10% de descuento, compra mínima $500.','VIP20: 20% de descuento, con tope de $300.','Los códigos no distinguen mayúsculas. Total debe ser mayor a 0.','Respuestas: 200, 400, 404 (no existe), 410 (expirado), 422 (mínimo).'],
 def:['POST','/api/cupon','{"code":"NOVA10","total":800}'],
 bugs:['Acepta totales negativos o cero en vez de responder 400.','El código en minúsculas ("nova10") da 404 aunque no debería distinguir mayúsculas.','Con total exactamente 500, NOVA10 se rechaza (el mínimo debería incluir 500).','VIP20 no respeta el tope de $300 (probá con total 5000).'],
 init:()=>({}),
 run(m,u,b){
  if(m!=='POST'||u.pathname!=='/api/cupon')return[404,{error:'Ruta no encontrada'}];
  if(!b||typeof b.total!=='number')return[400,{error:'total debe ser numérico'}];
  const c=String(b.code||''),t=b.total,r=x=>Math.round(x*100)/100;
  if(c==='EXPIRADO')return[410,{error:'Cupón expirado'}];
  if(c==='NOVA10'){if(!(t>500))return[422,{error:'Compra mínima $500'}];return[200,{descuento:r(t*.1),total_final:r(t*.9)}]}
  if(c==='VIP20')return[200,{descuento:r(t*.2),total_final:r(t*.8)}];
  return[404,{error:'Cupón no existe'}]}},
{id:'registro',nivel:1,emp:'BancoLuz',tit:'Registro de usuarios',
 his:'BancoLuz quiere que sus nuevos clientes se registren en línea con email, contraseña y edad.',
 doc:['POST /api/registro  {"email", "password", "edad"}','Email con formato válido (algo@dominio.ext).','Contraseña: mínimo 8 caracteres y al menos un número.','Solo mayores de edad (18 o más).','Un email ya registrado responde 409. Ya existe: ana@mail.com','Respuestas: 201, 400, 403, 409.'],
 def:['POST','/api/registro','{"email":"luis@mail.com","password":"clave1234","edad":25}'],
 bugs:['Emails como "a@b" o "@" se aceptan como válidos.','Contraseñas de 8+ caracteres sin números se aceptan.','Con edad 18 rechaza (debería aceptar a partir de 18).','Un email repetido (ana@mail.com) crea otra cuenta en vez de 409.'],
 init:()=>({}),
 run(m,u,b){
  if(m!=='POST'||u.pathname!=='/api/registro')return[404,{error:'Ruta no encontrada'}];
  if(!b)return[400,{error:'Falta el cuerpo'}];
  if(!b.email||!String(b.email).includes('@'))return[400,{error:'Email inválido'}];
  if(!b.password||String(b.password).length<8)return[400,{error:'Contraseña muy corta'}];
  if(!(b.edad>18))return[403,{error:'Debes ser mayor de edad'}];
  return[201,{mensaje:'Usuario creado',email:b.email}]}},
{id:'envio',nivel:0,emp:'EnvíaYa',tit:'Cálculo de envío',
 his:'EnvíaYa quiere mostrar el costo de un paquete antes de pagar, según peso y zona.',
 doc:['GET /api/envio?peso=2.5&zona=norte','Zonas: norte = $50 + $10 por kg; sur = $70 + $12 por kg.','Cada kg o fracción se cobra completo (2.3 kg = 3 kg).','Peso máximo: 30 kg (30 incluido). Peso debe ser mayor a 0.','Zona desconocida → 400. Respuestas: 200, 400, 422.'],
 def:['GET','/api/envio?peso=2.5&zona=norte',''],
 bugs:['Redondea el peso al más cercano en vez de cobrar la fracción completa (2.3 kg cobra 2).','Con peso=30 responde 422 (30 kg debería estar permitido).','Una zona desconocida devuelve 200 con costo null en vez de 400.'],
 init:()=>({}),
 run(m,u){
  if(m!=='GET'||u.pathname!=='/api/envio')return[404,{error:'Ruta no encontrada'}];
  const p=parseFloat(u.searchParams.get('peso')),z=u.searchParams.get('zona'),T={norte:[50,10],sur:[70,12]};
  if(!(p>0))return[400,{error:'peso inválido'}];
  if(p>=30)return[422,{error:'Peso máximo 30 kg'}];
  if(!T[z])return[200,{zona:z,costo:null}];
  return[200,{zona:z,peso:p,costo:T[z][0]+Math.round(p)*T[z][1]}]}},
{id:'reserva',nivel:1,emp:'HotelMar',tit:'Reserva de habitaciones',
 his:'HotelMar quiere que los huéspedes reserven en línea y vean el precio total de su estancia.',
 doc:['POST /api/reserva  {"entrada":"2026-10-05","salida":"2026-10-08","huespedes":2}','Hoy es 2026-09-27. No se reserva en fechas pasadas.','La salida debe ser posterior a la entrada.','1 a 4 huéspedes. $1200 por noche.','7 noches o más: 10% de descuento.','Respuestas: 201, 400.'],
 def:['POST','/api/reserva','{"entrada":"2026-10-05","salida":"2026-10-08","huespedes":2}'],
 bugs:['Permite entrada en el pasado (probá 2026-01-01).','Acepta salida igual a la entrada (0 noches).','No limita huéspedes a 4 (acepta 5 o más).','El descuento aplica desde 8 noches, no desde 7.'],
 init:()=>({}),
 run(m,u,b){
  if(m!=='POST'||u.pathname!=='/api/reserva')return[404,{error:'Ruta no encontrada'}];
  if(!b)return[400,{error:'Falta el cuerpo'}];
  const e=Date.parse(b.entrada),s=Date.parse(b.salida);
  if(isNaN(e)||isNaN(s))return[400,{error:'Fechas inválidas (usa AAAA-MM-DD)'}];
  if(s<e)return[400,{error:'La salida debe ser posterior a la entrada'}];
  if(!(b.huespedes>=1))return[400,{error:'Mínimo 1 huésped'}];
  const n=(s-e)/864e5;let t=n*1200;if(n>7)t*=.9;
  return[201,{noches:n,total:t}]}},
{id:'libros',nivel:0,emp:'LibroMundo',tit:'Listado paginado',
 his:'LibroMundo quiere mostrar su catálogo (23 libros) por páginas en la app móvil.',
 doc:['GET /api/libros?page=1&limit=10','page empieza en 1. limit entre 1 y 20 (por defecto 10).','Respuesta: {items, pagina, total_paginas}','Una página que no existe → 404.','Respuestas: 200, 400, 404.'],
 def:['GET','/api/libros?page=1&limit=10',''],
 bugs:['limit=0 devuelve los 23 libros; limit=50 se acepta (debería ser 400 fuera de 1–20).','total_paginas usa división hacia abajo (23 libros / 10 = 2, debería ser 3).','Una página inexistente (page=99) devuelve 200 con lista vacía en vez de 404.'],
 init:()=>({}),
 run(m,u){
  if(m!=='GET'||u.pathname!=='/api/libros')return[404,{error:'Ruta no encontrada'}];
  const q=u.searchParams,pg=q.get('page')===null?1:+q.get('page');let l=q.get('limit')===null?10:+q.get('limit');
  if(!(pg>=1)||isNaN(l))return[400,{error:'parámetros inválidos'}];
  const all=Array.from({length:23},(_,i)=>'Libro '+(i+1));
  if(l<=0)l=23;
  return[200,{items:all.slice((pg-1)*l,pg*l),pagina:pg,total_paginas:Math.floor(23/l)}]}},
{id:'login',nivel:1,emp:'AppSegura',tit:'Inicio de sesión con bloqueo',
 his:'AppSegura quiere proteger las cuentas: tras varios intentos fallidos, la cuenta se bloquea.',
 doc:['POST /api/login  {"user":"demo","pass":"Secreta123"}','3 contraseñas incorrectas seguidas bloquean la cuenta (423).','Una cuenta bloqueada no inicia sesión ni con la clave correcta.','Los errores no deben revelar si el usuario existe.','Campos vacíos → 400. Respuestas: 200, 400, 401, 423.'],
 def:['POST','/api/login','{"user":"demo","pass":"mala"}'],
 bugs:['Bloquea al 4.º intento fallido en vez del 3.º.','Con la cuenta bloqueada, la clave correcta igual inicia sesión.','Distingue "usuario no existe" de "contraseña incorrecta" (filtra información).','Sin user/pass responde 500 en vez de 400.'],
 init:()=>({f:0}),
 run(m,u,b,st){
  if(m!=='POST'||u.pathname!=='/api/login')return[404,{error:'Ruta no encontrada'}];
  if(!b||!b.user||!b.pass)return[500,{error:"Cannot read properties of undefined (reading 'trim')"}];
  if(b.user!=='demo')return[401,{error:'El usuario no existe'}];
  if(b.pass==='Secreta123')return[200,{token:'tk_'+Math.random().toString(36).slice(2,10)}];
  st.f++;if(st.f>=4)return[423,{error:'Cuenta bloqueada'}];
  return[401,{error:'Contraseña incorrecta'}]}}
,{id:'transfer',nivel:2,emp:'BancoLuz',tit:'Transferencias entre cuentas',
 his:'BancoLuz quiere mover dinero entre cuentas por API, sin duplicar cobros aunque el cliente reintente la petición.',
 doc:['GET /api/cuentas/A001  → saldo. Cuentas: A001 ($8000), A002 ($500), A003 ($0).','POST /api/transferir  {"origen","destino","monto","clave"}','monto > 0, con máximo 2 decimales. Origen y destino distintos y existentes (404).','Máximo $3000 por transferencia y $5000 acumulados por día y por cuenta origen (422).','Se puede transferir todo el saldo (queda en $0). Si no alcanza → 422.','clave es de idempotencia: repetir la misma clave NO mueve dinero otra vez; devuelve el resultado original.','Respuestas: 200, 400, 404, 422.'],
 def:['POST','/api/transferir','{"origen":"A001","destino":"A002","monto":100,"clave":"op-001"}'],
 bugs:['Con monto igual al saldo total responde 422 (debería permitirlo y dejar $0).','Acepta origen y destino iguales.','Repetir la misma clave vuelve a descontar el dinero (idempotencia rota).','No lleva el acumulado diario: se puede superar $5000 con varias transferencias de $3000.','Acepta más de 2 decimales (10.555) y los saldos arrastran errores de coma flotante.','Consultar una cuenta inexistente devuelve 200 con saldo 0 en vez de 404.'],
 init:()=>({acc:{A001:8000,A002:500,A003:0}}),
 run(m,u,b,st){
  const A=st.acc,g=u.pathname.match(/^\/api\/cuentas\/(\w+)$/);
  if(m==='GET'&&g)return[200,{id:g[1],saldo:A[g[1]]??0}];
  if(m==='POST'&&u.pathname==='/api/transferir'){
   if(!b||!(b.monto>0))return[400,{error:'monto inválido'}];
   if(!b.clave)return[400,{error:'falta clave de idempotencia'}];
   if(!(b.origen in A)||!(b.destino in A))return[404,{error:'cuenta no existe'}];
   if(b.monto>3000)return[422,{error:'Máximo $3000 por transferencia'}];
   if(b.monto>=A[b.origen])return[422,{error:'Saldo insuficiente'}];
   A[b.origen]-=b.monto;A[b.destino]+=b.monto;
   return[200,{ok:true,saldo_origen:A[b.origen],saldo_destino:A[b.destino]}]}
  return[404,{error:'Ruta no encontrada'}]}},
{id:'pedidos',nivel:2,emp:'TiendaNova',tit:'Pedidos y estados',
 his:'TiendaNova quiere crear pedidos y avanzar su estado hasta la entrega, sin permitir saltos ilógicos.',
 doc:['POST /api/pedidos  {"items":[{"sku":"LAP","qty":1}]}  → 201 {id, estado, total}','Precios: LAP $900, MOU $25, TEC $60. qty entero de 1 a 10. Máximo 5 líneas. SKU desconocido → 400.','Envío $50; gratis si el subtotal es $1000 o más.','GET /api/pedidos/{id}  → 404 si no existe.','POST /api/pedidos/{id}/estado  {"estado":"pagado"}','Flujo: creado → pagado → enviado → entregado. Se puede cancelar solo desde creado o pagado.','entregado y cancelado son finales. Transición inválida → 409. Id inexistente → 404.'],
 def:['POST','/api/pedidos','{"items":[{"sku":"MOU","qty":2}]}'],
 bugs:['Acepta qty 0, negativa o decimal (2.5).','El envío es gratis solo desde $1000.01 (con subtotal exacto de $1000 cobra $50).','Permite saltar de creado a enviado sin pasar por pagado.','Permite cancelar un pedido ya enviado.','Un pedido entregado puede volver a creado (debería ser final).','Cambiar el estado de un id inexistente responde 500 en vez de 404.'],
 init:()=>({n:0,P:{}}),
 run(m,u,b,st){
  const P={LAP:900,MOU:25,TEC:60},T={creado:['pagado','cancelado','enviado'],pagado:['enviado','cancelado'],enviado:['entregado','cancelado'],entregado:['creado'],cancelado:[]};
  if(m==='POST'&&u.pathname==='/api/pedidos'){
   if(!b||!Array.isArray(b.items)||!b.items.length||b.items.length>5)return[400,{error:'items inválidos'}];
   let sub=0;for(const i of b.items){if(!(i.sku in P))return[400,{error:'SKU desconocido: '+i.sku}];if(typeof i.qty!=='number'||i.qty>10)return[400,{error:'qty inválida'}];sub+=P[i.sku]*i.qty}
   const id='P'+(++st.n),o={id,estado:'creado',total:sub+(sub>1000?0:50)};st.P[id]=o;return[201,o]}
  const g=u.pathname.match(/^\/api\/pedidos\/(\w+)(\/estado)?$/);
  if(g&&m==='GET'&&!g[2])return st.P[g[1]]?[200,st.P[g[1]]]:[404,{error:'Pedido no existe'}];
  if(g&&m==='POST'&&g[2]){
   const o=st.P[g[1]];const from=o.estado;
   if(!b||!(b.estado in T))return[400,{error:'estado inválido'}];
   if(!T[from].includes(b.estado))return[409,{error:`No se puede pasar de ${from} a ${b.estado}`}];
   o.estado=b.estado;return[200,o]}
  return[404,{error:'Ruta no encontrada'}]}}

];
const API='';
const URL_USR=API+'/usuarios/update',URL_FIN=API+'/finalizar_act';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let p=null,s=null,me=null,done=false,inicio=new Date().toISOString();
const flag=t=>{$('flag').textContent=t};
const NEW={
registro:{wm:'GET',base:'/api/registro',
 his:'BancoLuz quiere que sus nuevos clientes abran una cuenta en línea. El equipo ya construyó el servicio y necesita que alguien lo pruebe antes de salir a producción.',
 api:[{r:'/api/registro',d:'Da de alta a un cliente nuevo.',i:'{ email, password, edad }',o:'{ mensaje, email } si la cuenta se crea; { error } si se rechaza'}],
 reglas:['El email debe tener formato válido (algo@dominio.ext).','La contraseña debe tener mínimo 8 caracteres y al menos un número.','Solo pueden registrarse mayores de edad (18 o más).','Un email ya registrado no puede volver a crearse. Ya existe: ana@mail.com','Códigos posibles: 201, 400, 403, 409.']},
reserva:{wm:'DELETE',base:'/api/reserva',
 his:'HotelMar quiere que los huéspedes reserven en línea y vean el precio total de su estancia. El servicio ya está construido y hay que validarlo.',
 api:[{r:'/api/reserva',d:'Registra una reserva y calcula el precio total.',i:'{ entrada, salida, huespedes }  (fechas en formato AAAA-MM-DD)',o:'{ noches, total } si se acepta; { error } si no'}],
 reglas:['Hoy es 2026-09-27. No se reserva en fechas pasadas.','La salida debe ser posterior a la entrada.','Se aceptan de 1 a 4 huéspedes.','Cada noche cuesta $1200. Estancias de 7 noches o más tienen 10% de descuento.','Códigos posibles: 201, 400.']},
login:{wm:'GET',base:'/api/login',
 his:'AppSegura quiere proteger las cuentas de sus usuarios: tras varios intentos fallidos, la cuenta se bloquea. Hay que comprobar que el servicio de acceso se comporta como debe.',
 api:[{r:'/api/login',d:'Valida las credenciales y entrega un token de sesión.',i:'{ user, pass }',o:'{ token } si entra; { error } si no'}],
 reglas:['Existe la cuenta "demo" con clave Secreta123.','3 contraseñas incorrectas seguidas bloquean la cuenta (423).','Una cuenta bloqueada no inicia sesión ni con la clave correcta.','Los errores no deben revelar si el usuario existe.','Campos vacíos → 400. Códigos posibles: 200, 400, 401, 423.']},
transfer:{wm:'DELETE',base:'/api/transferir',
 his:'BancoLuz quiere mover dinero entre cuentas por API, sin duplicar cobros aunque el cliente reintente la operación. Tu trabajo es encontrar dónde falla.',
 api:[{r:'/api/cuentas/{id}',d:'Consulta el saldo de una cuenta.',i:'El id va en la ruta, ej. /api/cuentas/A001',o:'{ id, saldo }'},
      {r:'/api/transferir',d:'Mueve dinero de una cuenta a otra.',i:'{ origen, destino, monto, clave }',o:'{ ok, saldo_origen, saldo_destino }; { error } si falla'}],
 reglas:['Cuentas disponibles: A001 ($8000), A002 ($500), A003 ($0).','Una cuenta que no existe → 404 (al consultar y al transferir).','monto mayor a 0, con máximo 2 decimales.','Origen y destino deben ser distintos.','Máximo $3000 por transferencia y $5000 acumulados por día por cuenta origen (422).','Se puede transferir todo el saldo (queda en $0). Si no alcanza → 422.','clave es de idempotencia: repetir la misma clave NO mueve dinero otra vez; devuelve el resultado original.','Códigos posibles: 200, 400, 404, 422.']},
pedidos:{wm:'PUT',base:'/api/pedidos',
 his:'TiendaNova quiere que sus clientes creen pedidos y que el pedido avance por estados hasta la entrega, sin permitir saltos ilógicos. Los servicios ya están construidos y hay que probarlos.',
 api:[{r:'/api/pedidos',d:'Crea un pedido nuevo con uno o varios productos. Nace en estado "creado".',i:'{ items: [ { sku, qty } ] }',o:'{ id, estado, total }  (el id, como P1, P2…, sirve para los demás servicios)'},
      {r:'/api/pedidos/{id}',d:'Consulta un pedido que ya fue creado.',i:'El id va en la ruta, ej. /api/pedidos/P1',o:'{ id, estado, total }'},
      {r:'/api/pedidos/{id}/estado',d:'Avanza o cancela un pedido existente.',i:'{ estado }  (ej. "pagado")',o:'El pedido con su nuevo estado; { error } si no se permite'}],
 reglas:['Precios: LAP $900, MOU $25, TEC $60.','qty entero de 1 a 10. Máximo 5 líneas por pedido. SKU desconocido → 400.','Envío $50; gratis si el subtotal es $1000 o más. El total incluye el envío.','Flujo: creado → pagado → enviado → entregado. Solo se puede cancelar desde creado o pagado.','entregado y cancelado son finales. Transición inválida → 409.','Consultar o cambiar el estado de un id que no existe → 404.','Códigos posibles: 200, 201, 400, 404, 409.']}};
const FIELDS={
registro:[['email','texto','Correo de la persona que se registra','"luis@mail.com"'],['password','texto','Contraseña que elige para su cuenta','"clave1234"'],['edad','número','Edad de la persona, en años','25']],
reserva:[['entrada','texto (fecha)','Día de llegada al hotel, en formato AAAA-MM-DD','"2026-10-05"'],['salida','texto (fecha)','Día en que se va del hotel, en formato AAAA-MM-DD','"2026-10-08"'],['huespedes','número entero','Cantidad de personas que se hospedan','2'],['noches','número','Noches de la estancia (calculadas por el servicio)','3']],
login:[['user','texto','Nombre de usuario de la cuenta','"demo"'],['pass','texto','Contraseña de esa cuenta','"Secreta123"'],['token','texto','Código que identifica la sesión abierta; lo entrega el servicio','"tk_a1b2c3d4"']],
transfer:[['id','texto','Identificador de una cuenta; va en la ruta','"A001"'],['origen','texto','Cuenta de la que sale el dinero','"A001"'],['destino','texto','Cuenta que recibe el dinero','"A002"'],['monto','número','Dinero a mover, en pesos','100  ó  49.99'],['clave','texto','Identificador único de la operación; si el cliente reintenta con la misma clave, no se cobra dos veces','"op-001"'],['saldo','número','Dinero disponible en una cuenta','8000']],
pedidos:[['items','lista','Productos del pedido; cada elemento lleva un sku y una qty','[ { "sku": "MOU", "qty": 2 } ]'],['sku','texto','Código del producto (LAP = laptop, MOU = mouse, TEC = teclado)','"MOU"'],['qty','número entero','Cantidad de unidades de ese producto','2'],['id','texto','Identificador del pedido; lo entrega el servicio al crearlo','"P1"'],['estado','texto','Etapa del pedido: creado, pagado, enviado, entregado o cancelado','"pagado"'],['total','número','Subtotal de los productos más el envío','75']]};
S.forEach(x=>Object.assign(x,NEW[x.id]||{}));
const post=async(u,d)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const draft=()=>LS('draft:'+me.correo,{hist:s.hist.slice(-100),notes:s.notes});

function reg(msg){
  flag('');
  $('pane').innerHTML=`<div class="card hero"><span class="tag">Prueba técnica</span><h2>Bienvenido/a</h2>
  <p class="hint" style="margin:0">Recibirás un caso real de una empresa. No hay opción de elegir: te toca uno.</p>
  <ol class="steps"><li>Lee el caso y averigua cómo se usa el servicio.</li><li>Pruébalo como QA con el cliente de peticiones.</li><li>Anota los bugs que encuentres y envía tu reporte.</li></ol>
  <label class="t" for="rn">Nombre completo</label><input id="rn" autocomplete="name">
  <label class="t" for="rc">Correo</label><input id="rc" type="email" autocomplete="email">
  <p id="rm" role="alert" style="color:var(--er);margin:10px 0 0"></p>
  <button class="p" id="rb" style="margin-top:14px;width:100%">Comenzar prueba</button></div>`;
  $('rm').textContent=msg||'';
  $('rb').onclick=async()=>{
    const nombre=$('rn').value.trim(),correo=$('rc').value.trim().toLowerCase();
    if(!nombre||!/^\S+@\S+\.\S+$/.test(correo)){$('rm').textContent='Escribe tu nombre y un correo válido.';return}
    $('rb').disabled=true;$('rm').textContent='';
    try{start(await post(URL_USR,{nombre,correo}))}
    catch(e){$('rb').disabled=false;$('rm').textContent='No se pudo registrar ('+e.message+'). Verifica que el servidor esté activo.'}}
}
function start(u){
  p=S.find(x=>x.id===u.actividad_id);
  if(!p){reg('Actividad desconocida: '+u.actividad_id);return}
  me=u;LS('usr',{nombre:u.nombre,correo:u.correo});
  done=u.estado==='finalizada';inicio=u.creado_en||inicio;
  const d=LS('draft:'+u.correo)||{};
  s={data:p.init(),hist:d.hist||[],notes:d.notes||'',req:{m:p.wm,u:p.base,b:''},res:null};
  flag('Sesión: '+u.nombre);render();
}
const TPL='Caso: \nPetición: \nEsperado: \nObtenido: \n\n';
function render(){
  const eps=p.api.map(e=>`<div class="ep"><code class="path">${esc(e.r)}</code><p>${esc(e.d)}</p><dl><dt>Recibe</dt><dd>${esc(e.i)}</dd><dt>Responde</dt><dd>${esc(e.o)}</dd></dl></div>`).join('');
  const fl=(FIELDS[p.id]||[]).map(([n,t,d,e])=>`<tr><td><code class="path">${esc(n)}</code><br><span class="hint">${esc(t)}</span></td><td>${esc(d)}<br><code>Ej: ${esc(e)}</code></td></tr>`).join('');
  $('pane').innerHTML=`<div class="grid">
  <aside class="card brief"><span class="tag">${esc(p.emp)}</span><h2>${esc(p.tit)}</h2><p style="margin:6px 0 0">${esc(p.his)}</p>
    <h3>Servicios disponibles</h3>${eps}<h3>Significado de los campos</h3><table class="fd">${fl}</table><h3>Reglas de negocio</h3><ul class="rl">${p.reglas.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></aside>
  <div class="work">
   <div class="card"><div class="row"><b>Cliente de peticiones</b><span class="hint">Elige el método correcto y prueba el servicio</span></div>
    <div class="bar"><select id="m" aria-label="Método"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><input id="u" aria-label="Ruta" spellcheck="false"><button class="p" id="go">Enviar</button></div>
    <div class="two"><div><label class="t" for="b">Cuerpo (JSON)</label><textarea id="b" spellcheck="false" placeholder='{ "campo": "valor" }'></textarea></div>
     <div><label class="t">Respuesta <span id="chip"></span></label><pre class="out" id="out">Aún no enviaste ninguna petición.</pre></div></div>
    <div class="hist" id="hist"></div></div>
   <div class="card"><div class="row"><label class="t" for="n" style="margin:0">Reporte de QA: casos probados y bugs encontrados</label><button id="tp">+ Plantilla</button></div>
    <textarea id="n" style="min-height:190px;margin-top:10px" placeholder="Ej: Caso: total=-50 → devolvió 200, debería ser 400"></textarea>
    <div class="row" style="margin-top:12px"><span class="hint">Se guarda solo en este navegador hasta que envíes.</span><span><button id="rs">Reiniciar datos de la API</button> <button class="p" id="fin"></button></span></div></div>
  </div></div>`;
  $('m').value=s.req.m;$('m').dataset.m=s.req.m;$('u').value=s.req.u;$('b').value=s.req.b;$('n').value=s.notes;
  $('m').onchange=e=>e.target.dataset.m=e.target.value;
  $('go').onclick=send;$('u').onkeydown=e=>{if(e.key==='Enter')send()};$('b').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))send()};
  $('n').oninput=e=>{s.notes=e.target.value;draft()};
  $('tp').onclick=()=>{if(done)return;const n=$('n');n.value+=(n.value&&!n.value.endsWith('\n\n')?'\n\n':'')+TPL;n.oninput({target:n});n.focus()};
  $('fin').textContent=done?'Prueba enviada ✓':'Finalizar y enviar';$('fin').disabled=done;
  $('fin').onclick=async()=>{
    if(!confirm('Al enviar no podrás editar tu reporte. ¿Continuar?'))return;
    $('fin').disabled=true;flag('Enviando…');
    try{await post(URL_FIN,{correo:me.correo,actividad_id:p.id,notas:s.notes,historial:s.hist,inicio});
      done=true;LS('draft:'+me.correo,null);flag('Prueba enviada ✓');render()}
    catch(e){$('fin').disabled=false;flag('No se pudo enviar ('+e.message+'). Intenta de nuevo.')}};
  $('rs').onclick=()=>{s.data=p.init();s.res=null;render()};
  if(done){$('n').readOnly=true;$('tp').disabled=true}
  showRes();drawHist();
}
function showRes(){
  if(!s.res)return;
  $('chip').innerHTML=`<span class="chip s${String(s.res.c)[0]}">${s.res.c} · ${s.res.ms} ms</span>`;
  $('out').textContent=JSON.stringify(s.res.b,null,2);
}
function drawHist(){
  const h=$('hist');h.innerHTML=s.hist.length?'<span class="hint">Historial (clic para repetir)</span>':'';
  s.hist.slice(-6).reverse().forEach(r=>{const b=document.createElement('button');
    b.innerHTML=`<span class="mb mb-${esc(r.m)}">${esc(r.m)}</span><span class="u">${esc(r.u)}</span><span class="chip s${String(r.c)[0]}">${esc(r.c)}</span>`;
    b.onclick=()=>{s.req={m:r.m,u:r.u,b:r.b};$('m').value=r.m;$('m').dataset.m=r.m;$('u').value=r.u;$('b').value=r.b};h.appendChild(b)});
}
function send(){
  const m=$('m').value,url=$('u').value.trim(),raw=$('b').value.trim();
  s.req={m,u:url,b:raw};
  let body=null,code,resp;
  try{if(raw&&m!=='GET')body=JSON.parse(raw)}catch(e){code=400;resp={error:'JSON inválido en el cuerpo'}}
  if(!code){try{const u=new URL(url,'http://api.local');[code,resp]=p.run(m,u,body,s.data);
    if(code===404&&resp.error==='Ruta no encontrada'&&/^\/api\/(registro|reserva|login|transferir|pedidos|cuentas)(\/|$)/.test(u.pathname)){code=405;resp={error:'Método no permitido'}}
  }catch(e){code=500;resp={error:String(e.message)}}}
  s.res={c:code,b:resp,ms:20+(Math.random()*90|0)};
  s.hist.push({m,u:url,b:raw,c:code,r:resp});
  showRes();drawHist();draft();
}
const saved=LS('usr');
if(saved)post(URL_USR,saved).then(start).catch(()=>reg());else reg();
</script>
</body>
</html>
